name: l2-newera

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-l2jdb}
      POSTGRES_USER: ${POSTGRES_USER:-brproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - l2-newera-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrate
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-l2jdb}
      DB_USER: ${POSTGRES_USER:-brproject}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GAME_SERVER_HEXID: ${GAME_SERVER_HEXID:-3f8a2c7e6b1d4a9085c2e1f7b9d63042}
      GAME_SERVER_HOST: ${GAME_SERVER_HOST:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

  login-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.login
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-l2jdb}
      DB_USER: ${POSTGRES_USER:-brproject}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GAME_SERVER_HEXID: ${GAME_SERVER_HEXID:-3f8a2c7e6b1d4a9085c2e1f7b9d63042}
      GAME_SERVER_HOST: ${GAME_SERVER_HOST:-127.0.0.1}
      JAVA_OPTS: ${LOGIN_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    ports:
      - "${LOGIN_PORT:-2106}:2106"
      - "${LOGIN_GS_PORT:-9014}:9014"
    volumes:
      - l2-newera-login-logs:/l2Brproject/login/log
    depends_on:
      migrate:
        condition: service_completed_successfully
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock: -1

  game-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.game
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-l2jdb}
      DB_USER: ${POSTGRES_USER:-brproject}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GAME_SERVER_HEXID: ${GAME_SERVER_HEXID:-3f8a2c7e6b1d4a9085c2e1f7b9d63042}
      GAME_SERVER_HOST: ${GAME_SERVER_HOST:-127.0.0.1}
      JAVA_OPTS: ${GAME_JAVA_OPTS:--Xms1g -Xmx2g -XX:+UseG1GC}
    ports:
      - "${GAME_PORT:-7777}:7777"
    volumes:
      - l2-newera-game-logs:/l2Brproject/game/log
    depends_on:
      login-server:
        condition: service_started
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock: -1

volumes:
  l2-newera-postgres:
  l2-newera-login-logs:
  l2-newera-game-logs:
