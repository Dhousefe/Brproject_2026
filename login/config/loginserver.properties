#=============================================================
#                         Loginserver
#=============================================================

# This is transmitted to the clients, so it has to be an IP or resolvable hostname
Hostname = *

# Bind ip of the LoginServer, use * to bind on all available IPs
LoginserverHostname = *
LoginserverPort = 2106

# Porta interna para o LoginServer escutar quando o Proxy estiver ativo
LoginServerInternalPort = 2107

# The Loginserver host and port.
LoginHostname = 127.0.0.1
LoginPort = 9014

# How many times you can provide an invalid account/pass before the IP gets banned
LoginTryBeforeBan = 5

# Time you won't be able to login back again after LoginTryBeforeBan tries to login. Provide a value in seconds. Default 10min. (600)
LoginBlockAfterBan = 600

# If set to true, any GameServer can register on your login's free slots
AcceptNewGameServer = False

# If false, the licence (after the login) will not be shown. Default : true.
ShowLicence = True

#=============================================================
#                    Database informations
#=============================================================
# Default: SQLite (zero-config, no external server needed)
# Just start the server — it works out of the box!
#
# To use a different database, uncomment ONE of the lines below:
sql.url = jdbc:sqlite:../data/brproject.sqlite
# sql.url = jdbc:mariadb://127.0.0.1/l2teste?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&disabledAuthenticationPlugins=GSSAPI
# sql.url = jdbc:mariadb://localhost:3306/l2jdb?useUnicode=true&characterEncoding=UTF-8
# sql.url = jdbc:postgresql://localhost:5432/l2jdb
# sql.url = jdbc:sqlserver://localhost:1433;databaseName=l2jdb;encrypt=false
# sql.url = jdbc:mysql://localhost:3306/l2jdb?useUnicode=true&characterEncoding=UTF-8

# Credentials (not needed for SQLite)
sql.login = 
sql.password = 

# Usable values: "true" - "false", use this option to choose whether accounts will be created automatically or not.
AutoCreateAccounts = False

#=============================================================
#                        Security
#=============================================================

# FloodProtection. time in ms
EnableFloodProtection = True

FastConnectionLimit = 5
NormalConnectionTime = 2
FastConnectionTime = 3
MaxConnectionPerIP = 50

# Display player connections on the server in the console.
ShowConnect = False

# Enabled proxy? (data/xml/proxy.xml).
Proxy = False

# ================================================================
#                 Proxy Reverso Nativo Netty (modules/proxy)
# ================================================================
# Habilitar o Proxy Reverso Nativo Netty de borda (:proxy)
# Se habilitado, o LoginServer escuta na porta interna (2107) e o Proxy
# assume a porta publica (2106), aplicando rate limiting e protecao contra flood.
# Padrao: false (para isolamento estrito e zero regressao)
EnableNativeProxy = true

# Habilitar integracao com modulo de defesa Fail2Ban no LoginServer
EnableFail2Ban = false

# ================================================================
#              Fermata Discord Login (Protocolo 0xFD)
# ================================================================
# Habilita autenticacao externa via Discord no cliente Fermata.
# Desativado por padrao (fail-closed). Ao desativar, o login tradicional por senha
# opera normalmente e o servidor responde REASON_DISCORD_NOT_AVAILABLE (0x01) para
# solicitacoes Fermata.
DiscordLoginEnabled = false

# Identificador unico do servidor registrado para emissao e validacao de desafios
DiscordServerId = brproject-2026

# Chave secreta interna para assinar os desafios criptograficos (HMAC-SHA256)
DiscordChallengeSecret = brproject_discord_secret_2026_challenge_key

# Chave publica ou segredo compartilhado fornecido pelo Fermata para verificacao de provas (proofs)
DiscordProofPublicKey = 

# Tempo limite de validade de um desafio emitido (em segundos, 60s padrao, max 120s)
DiscordChallengeTimeoutSeconds = 60

#=============================================================
#                 Login Client & Session Timeout
#=============================================================
# Tempo limite em segundos de validade da sessao do cliente no LoginServer (padrao: 300s, permite >120s).
# Garante que clientes com conexao lenta ou carregamento demorado nao sejam expurgados antes de chegar ao GameServer.
LoginTimeoutSeconds = 300

