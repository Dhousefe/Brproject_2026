# ----------------------------------------------------------------
# GUIA DE MODOS DO CLOUDFLARE TUNNEL:
# 
# 1) MODO RAPIDO / EFEMERO (Padrao - Zero Configuracao):
#    - Nao precisa de conta, token ou dominio.
#    - A Cloudflare gera automaticamente uma URL publica gratuita em:
#      https://<4-palavras-aleatorias>.trycloudflare.com
#    - OBS: Por regras globais de seguranca e anti-phishing da Cloudflare,
#      o dominio trycloudflare.com SEMPRE sorteia palavras aleatorias em ingles.
#
# 2) MODO PROFISSIONAL / NOME DO SERVIDOR (Recomendado - 100% Gratuito):
#    - Permite usar o nome do seu projeto na URL oficial:
#      Exemplo: https://l2jbrasil.seudominio.com ou https://site.l2jbrasil.com
#    - Como configurar passo a passo:
#      1. Crie uma conta gratuita em: https://dash.cloudflare.com
#      2. Va em: Zero Trust > Networks > Tunnels > Add a tunnel (ou Create Tunnel)
#      3. Escolha o tipo "Cloudflared" e de um nome para o tunel (ex: L2JBrasil)
#      4. No painel de instalacao, copie o TOKEN gerado (uma chave longa que comeca com eyJhIjoi...)
#      5. Na aba "Public Hostname", adicione a rota para o seu site:
#         - Subdomain: l2jbrasil (ou site)
#         - Domain: seudominio.com
#         - Service Type: HTTP
#         - URL: 127.0.0.1:8080 (ou localhost:8080)
#      6. Cole o token e o seu dominio completo abaixo:
# ----------------------------------------------------------------

# Token de Tunel Oficial do Cloudflare Zero Trust (Opcional)
# Painel: https://one.dash.cloudflare.com > Networks > Tunnels
# Exemplo: eyJhIjoiYm...
