# Dominio ou subdominio personalizado fixo no DNS da Cloudflare (Opcional)
# Exemplo: l2jbrasil.seudominio.com ou site.l2jbrasil.com
# Se configurado, sera usado como a URL oficial do site e nos webhooks do Top L2JBrasil.
