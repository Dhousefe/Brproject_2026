# ================================================================
#                 JIT C2 Warmup Service (Zero-Lag)
# ================================================================
# Executa aquecimento em background do compilador JIT Tier 4 (C2)
# logo apos o spawn diferido de NPCs, prevenindo picos de latencia,
# engasgos no pathfinding e overhead de serializacao nos primeiros logins.
# Roda em thread daemon com prioridade minima (MIN_PRIORITY) e pausas
# cooperativas, consumindo menos de 5% de um unico core.
# Padrao: True
EnableJitWarmup = True

# Quantidade de iteracoes sinteticas para aquecimento de C2 (~15000 recomendado).
# Minimo: 500 | Maximo: 20000
JitWarmupIterations = 15000

