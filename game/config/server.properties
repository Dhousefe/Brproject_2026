# ================================================================
#                   Configuracoes do Gameserver
# ================================================================
# Endereco transmitido aos clientes. Deve ser um IP ou hostname resolvivel.
# Se este IP for resolvivel pelo Loginserver, mantenha 127.0.0.1 ou o IP publico.
Hostname = *

# IP de escuta do Gameserver. Use * para escutar em todas as interfaces.
GameserverHostname = *
GameserverPort = 7777

# Porta interna para o GameServer escutar quando o Proxy estiver ativo
GameServerInternalPort = 7778

# IP e porta de conexao com o Loginserver.
LoginHost = 127.0.0.1
LoginPort = 9014

# ID do servidor solicitado ao Loginserver.
RequestServerID = 1

# Se True, o Loginserver atribuira outro ID caso o solicitado esteja ocupado.
AcceptAlternateID = True

# Usar criptografia Blowfish entre cliente e servidor (padrao: True).
# Nao altere este valor com o servidor rodando.
UseBlowfishCipher = True

# ================================================================
#             Motor de Transporte de Rede (Network Engine)
# ================================================================
# Escolha o motor de rede para conexao com clientes de jogo:
#   NETTY = Motor reativo assincrono com zero-copy e alta capacidade (Recomendado)
#   NIO   = Motor tradicional Java NIO baseado em SelectorThread (Legado)
NetworkEngine = NETTY
NettyBossThreads = 1
NettyWorkerThreads = 0

# Habilitar logs detalhados de rede e pacotes (Netty, Protocol, Auth, Handshake) no console
# Se False, o console permanece limpo sem exibicao de frames ou transicoes de pacotes normais.
# Padrao: False
debugnet = False

# ================================================================
#                 Proxy Reverso Nativo Netty (modules/proxy)
# ================================================================
# As rotas e configuracoes de proxy reverso e rate limiting sao
# gerenciadas centralizadamente em: game/data/custom/mods/proxy.xml
#
# Habilitar o Proxy Reverso Nativo Netty de borda (:proxy)
# Se habilitado, o GameServer escuta na porta interna (7778) e o Proxy assume
# a porta publica (7777), aplicando rate limiting e protecao contra flood.
# Padrao: false (para isolamento estrito e zero regressao)
EnableNativeProxy = true

# Iniciar o processo do Proxy Nativo automaticamente junto com o GameServer
NativeProxyAutoStart = true

# Caminho do arquivo mestre de configuracao de rotas XML
NativeProxyConfigFile = game/data/custom/mods/proxy.xml

# ================================================================
#                     Modulo de Defesa Fail2Ban
# ================================================================
# Habilitar o subsistema de deteccao de intrusao e banimento Fail2Ban
# Se habilitado, monitora ataques de forca bruta, scanners e floods
EnableFail2Ban = false

# Habilitar integracao com firewall do sistema operacional (netsh / iptables)
Fail2BanFirewall = true


