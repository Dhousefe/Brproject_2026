#=============================================================
#                    Hwid System Manager
#=============================================================
# Allow Guard Protection System
AllowGuardSystem = True

# Installing client HWID
# 1 = HWID HDD
# 2 = HWID MAC
# 3 = HWID CPU
UseClientHWID = 2
KickWithEmptyHWID = False
KickWithLastErrorHWID = False

# What is the criterion to prohibit the launch of multiple windows? 
# IP - to IP, HWID - client on HWID
ClientWindowsCountSec = IP

# Configure the number of open windows client 
# If 0 = Unlimited
AllowedWindowsCount = 2

# Enable log on Console Server - Player, HWID, NAME, ID
EnableConsoleLog = True
EnableHWIDBans = True
EnableHWIDBonus = True
StoreHWID = True
LogHWIDs = True

#=============================================================
#           Fermata Client Fingerprint v1 (CFP)
#=============================================================
# Habilita suporte a identificação opcional CFP para clientes Fermata.
# Se False, o servidor não emite ClientFingerprintChallenge e o cliente
# Fermata segue o fluxo legado normal exibindo os personagens sem erros.
FermataCfpEnabled = False

# Exigir prova criptográfica assinada com chave privada do cliente.
# Se False, aceita o registro de 37 bytes selecionado pelo cliente.
FermataCfpRequireProof = False

# Fornecer identidade sintética de escopo de conexão quando o cliente
# não possuir fonte local válida disponível (conforme especificação Fermata).
FermataCfpAllowConnectionFallback = True

# Tempo limite em segundos para conclusão do desafio CFP (padrão recomendado: 300s).
FermataCfpChallengeTimeoutSeconds = 300

#=============================================================
#           Character Selection & Idle Wait Protection
#=============================================================
# Tempo limite em segundos na tela de seleção de personagens (AUTHED)
# antes de desconectar por inatividade. Permite valores superiores a 120s
# para clientes que demoram a carregar texturas, mods, shaders ou FermaUI.
# Se 0, desativa o timeout de inatividade na tela de seleção de personagens.
# Padrão: 300 segundos (5 minutos).
CharacterSelectionTimeoutSeconds = 300
