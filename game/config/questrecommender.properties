# =================================================================
# QuestRecommender - Motor de Recomendação Vetorial de Quests
# =================================================================
# Este arquivo deve ser salvo em UTF-8 para acentuação correta.

# Ativa/desativa o motor de recomendação.
QuestRecommenderEnabled = False

# ID único do ícone de tutorial (quest mark) para recomendação de quests.
# Distinto de 2010 (LevelUpMaker), 2000 (Tournament), 2001 (CTF), etc.
QuestRecommenderQuestionMarkId = 2020

# Limite máximo de range em unidades Lineage 2 para guiar pelo Radar (Minimapa/Bússola).
# Se o jogador estiver dentro de 5000 unidades (ou na mesma cidade), a agulha aponta para o NPC.
# Se estiver além de 5000 unidades e fora da cidade, o jogador é teleportado para a cidade mais próxima do NPC.
QuestRecommenderRangeLimit = 5000

# Tempo de cast em milissegundos para o teleporte (barra de gauge e scroll animado).
QuestRecommenderCastTimeMs = 10000

# ID e nível da skill de escape/teleporte (2040 = Scroll of Escape).
QuestRecommenderScrollSkillId = 2040
QuestRecommenderScrollSkillLevel = 1

# Quantidade máxima de quests sugeridas por página na janela HTML.
QuestRecommenderTopK = 4

# Intervalo em segundos para verificar e enviar notificações de quests aos jogadores online.
QuestRecommenderRefreshIntervalSec = 300

# Delay em segundos após o level up para exibir recomendação de novas quests.
QuestRecommenderLevelUpDelaySec = 30

# Mensagem exibida caso o jogador tente usar o teleporte em condições proibidas (combate, karma, eventos).
QuestRecommenderCannotTeleportMessage = Você não pode usar o teleporte no momento. Verifique se está em combate, com karma ou em evento restrito.
