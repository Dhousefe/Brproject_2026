#=============================================================
#      Recuperação de Ataque e Reação de Movimento por DEX
#=============================================================
# Habilita o balanceamento de recuperação pós-ataque e fluidez de movimento/troca de alvos
# com base no atributo DEX do jogador (Mechanical Sympathy & Archetype Balance).
# Daggers e Arqueiros (alto DEX) destravam a movimentação e troca de alvos muito mais rápido.
# Magos (baixo DEX) mantêm a penalidade de travamento deliberado em ataques físicos.
# Padrão: True
EnableDexAttackRecoveryScaling = True

# Fator mínimo de recuperação (limite de velocidade para classes de agilidade extrema / tattoos / buffs).
# 0.50 significa até 50% de redução no delay de recuperação pós-hit.
# Padrão: 0.50
DexAttackRecoveryMinFactor = 0.50

# Fator máximo de recuperação (limite de lentidão para classes com DEX severamente rebaixado).
# 1.15 significa até 15% de lentidão adicional em classes sem vocação física.
# Padrão: 1.15

# DEX de referência neutra (fator 1.0 = sem bônus e sem penalidade).
# Padrão: 20
DexAttackRecoveryBaseDex = 20

# Divisor do delta de DEX para cálculo linear.
# Padrão: 45.0
DexAttackRecoveryDexDivisor = 45.0

# Bônus máximo percentual de aceleração de recuperação.
# Padrão: 0.45
DexAttackRecoveryMaxBonus = 0.45

#=============================================================
#   Mitigação de Flood de Skills & Amortecimento de ActionFailed
#=============================================================
# Tempo de debounce em milissegundos para suprimir rajadas de pacotes RequestMagicSkillUse
# idênticos (mesma skill e mesmo alvo) causados por tecla mantida pressionada (hold), macro ou auto-click.
# Durante o debounce, frames duplicados sofrem drop silencioso no servidor (zero ActionFailed redundante).
# Padrão: 200 ms
MagicSkillDebounceTimeMs = 200

# Janela de Skill Queuing em milissegundos antes do término do cast atual.
# Se o jogador apertar ou segurar a próxima skill dentro desta janela final da conjuração,
# o servidor agenda a próxima intenção de forma atômica sem descartar nem gerar falhas.
# Padrão: 300 ms
MagicSkillQueuingWindowMs = 300

# Intervalo mínimo de amortecimento histerético para reenvio de ActionFailed para a mesma conexão/jogador.
# O primeiro ActionFailed é entregue com latência zero (destravando a UI do cliente imediatamente),
# enquanto pacotes ActionFailed repetidos dentro desta janela são suprimidos para evitar saturação de TCP/PPS.
# Padrão: 250 ms
ActionFailedMinIntervalMs = 250

#=============================================================
#   Mitigação de Flood/DOS em RequestBypassToServer (Opcode 0x2f)
#=============================================================
# Janela de debounce em milissegundos para suprimir o mesmo comando de bypass enviado repetidamente
# em rajada por macros, atalhos rápidos ou scripts do cliente (drop silencioso sem processamento).
# Comandos diferentes enviados pelo jogador continuam passando imediatamente com latência zero.
# Padrão: 250 ms
RequestBypassDebounceTimeMs = 250

# Teto global de segurança anti-DOS: máximo de requisições de bypass aceitas por segundo por conexão.
# Mitiga ferramentas de flood/fuzzing automatizado sem degradar cliques legítimos de jogadores em menus.
# Padrão: 15 pacotes/segundo
RequestBypassMaxPacketsPerSecond = 15

#=============================================================
#      Balanceamento de Skills, Combate & Paridade L2OFF
#=============================================================

#-------------------------------------------------------------
# 1. Sistema de Crítico Mágico (M.Crit) & Nukers
#-------------------------------------------------------------
# Multiplicador de dano aplicado quando ocorre um acerto crítico mágico.
# Padrão Oficial L2OFF Vanilla: 3.0 (Dano Triplicado)
# Padrão L2J Clássico: 4.0 (Dano Quadruplicado)
# [ADVERTÊNCIA]: Valores acima de 4.0 (ex: 5.0 ou 6.0) causam ONE-SHOT em PvP,
# permitindo que Nukers (Archmage, SpS, SH) destruam tanks e daggers instantaneamente.
# Valores abaixo de 2.5 tornam os críticos mágicos irrelevantes frente ao alto M.Def.
MagicCriticalDamageMultiplier = 3.0

# Teto máximo (Hard Cap) percentual da chance de acerto de crítico mágico.
# Padrão Oficial L2OFF: 32.0 (%)
# [ADVERTÊNCIA]: Configurar acima de 40% faz magos de alto Cast Spd acertarem
# críticos em quase metade de seus disparos, desestabilizando lutas de CP/HP.
MagicCriticalRateCap = 32.0

#-------------------------------------------------------------
# 2. Sistema de Crítico Físico (Fighters & Skills Físicas)
#-------------------------------------------------------------
# Multiplicador de dano aplicado quando uma skill física sofre acerto crítico.
# Padrão Oficial L2OFF: 2.0 (Dano Dobrado)
# [ADVERTÊNCIA]: Acima de 2.5 resulta em danos desproporcionais com Triple Sonic Slash
# e Crush of Doom, ultrapassando 10k de dano em alvos de Heavy Armor.
PhysicalSkillCriticalMultiplier = 2.0

# Teto máximo (Hard Cap) de Critical Rate para ataques normais de fighters (permil).
# Padrão Oficial L2OFF: 500 (50.0% de chance de crítico)
# [ADVERTÊNCIA]: Ultrapassar 500 faz quase todo ataque branco ser crítico,
# beneficiando daggers e arqueiros de forma extrema contra classes mágicas.
PhysicalCriticalRateCap = 500

# Multiplicador de Soulshot em skills físicas.
# Padrão Oficial L2OFF: 2.0 (Dobra o P.Atk)
# Padrão L2J Legado: 2.04 (+4% extra residual de fórmulas C4)
PhysicalSoulshotSkillMultiplier = 2.0

#-------------------------------------------------------------
# 3. Daggers & Golpes de Adaga (Blows, Backstab, Posicional)
#-------------------------------------------------------------
# Teto máximo de taxa de acerto (Land Rate) para golpes normais de adaga (Deadly, Mortal, Blinding).
# Padrão Oficial L2OFF: 800 (80.0% máximo)
# [ADVERTÊNCIA]: Configurar em 1000 (100%) remove o fator de evasão de skills
# de adaga e torna daggers impossíveis de contra-atacar em PvP.
BlowRateCapGeneral = 800

# Teto máximo de taxa de acerto (Land Rate) específico para Backstab.
# Padrão Oficial L2OFF: 1000 (100.0% quando perfeitamente nas costas)
BlowRateCapBackstab = 1000

# Chance permitida de acertar Backstab quando desferido estritamente de FRENTE (permil).
# Padrão Oficial L2OFF: 0 (0% - Falha garantida se estiver de frente)
# Padrão L2J Legado: 30 (3.0% de chance forçada)
# [ADVERTÊNCIA]: Qualquer valor acima de 0 descaracteriza a exigência técnica de posicionamento do dagger.
BackstabFrontalRate = 0

# Multiplicador de bônus de dano e land rate nas COSTAS (Behind).
# Padrão Oficial L2OFF: 1.20 (+20%)
# Padrão L2J Legado: 1.15 (+15%)
BlowPositionalBehindBonus = 1.20

# Multiplicador de bônus de dano e land rate nos FLANCOS / LADOS (Side).
# Padrão Oficial L2OFF: 1.10 (+10%)
BlowPositionalSideBonus = 1.10

# Multiplicador empírico sobre o bônus flat de critical damage (CRITICAL_DAMAGE_ADD).
# Concedido por Ring of Queen Ant, Baium e Vicious Stance em skills Blow.
# Padrão Oficial L2OFF: 1.0 (Sem multiplicação inflada; filtrado por P.Def)
# Padrão L2J Legado: 6.0 (Multiplica o flat por 6, inflando brutalmente o dano em alvos de P.Def alta)
# [ADVERTÊNCIA]: Manter em 6.0 faz daggers com Boss Jewels ignorarem armadura pesada.
BlowCritAddPowerMultiplier = 1.0

#-------------------------------------------------------------
# 4. Debuffs, Status & Crowd Control (Soft Caps)
#-------------------------------------------------------------
# Chance mínima (Piso) para qualquer debuff mágico ou físico que não ignore resistências.
# Padrão Oficial L2OFF: 10 (%)
# Padrão L2J Legado: 1 (%)
# [ADVERTÊNCIA]: Valores abaixo de 5% inutilizam debuffs contra jogadores com Boss Jewels e buffs de clã.
DebuffMinLandRate = 15

# Chance máxima (Teto) para qualquer debuff mágico ou físico.
# Padrão Oficial L2OFF: 90 (%)
# Padrão L2J Legado: 99 (%)
# [ADVERTÊNCIA]: Valores acima de 90% tornam Anchor, Silence e Stun em efeitos quase garantidos,
# removendo a utilidade de buffs de resistência (Lionheart, Mental Shield).
DebuffMaxLandRate = 85

#-------------------------------------------------------------
# 5. Interrupção de Canalização de Magia (Cast Break)
#-------------------------------------------------------------
# Habilita o modelo de Cast Break proporcional oficial do L2OFF.
# Se True: A chance depende da proporção de dano sofrido em relação ao HP Máximo do alvo e seu atributo MEN.
# Se False: Usa a fórmula estática legada do L2J (15 * 100 / (100 + MEN)), ignorando o valor do dano.
# [ADVERTÊNCIA]: Manter como False faz qualquer dano de 1 ponto quebrar casts de magos com 10-15% de chance.
EnableRealisticCastBreak = True

# Teto máximo de chance percentual de quebra de cast em um único hit massivo.
# Padrão Oficial L2OFF: 80 (%)
CastBreakMaxRate = 80

#-------------------------------------------------------------
# 6. Cancelamento de Buffs (Cancel & Steal)
#-------------------------------------------------------------
# Ordem de remoção de efeitos no Cancel (Skill 1056) e variações.
# Se True: Padrão Oficial L2OFF - Varredura LIFO (Last In, First Out). Os últimos buffs aplicados
# (junk buffs / proteção no final da barra) são removidos primeiro.
# Se False: Padrão L2J Legado - Ordem puramente aleatória via Collections.shuffle.
# [ADVERTÊNCIA]: Se False, o uso tático de buffs descartáveis é inútil, punindo desproporcionalmente
# os jogadores em batalhas de Siege e PvP em grupo.
CancelDispelOrderLIFO = True

