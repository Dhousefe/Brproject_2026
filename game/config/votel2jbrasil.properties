# =================================================================
#                     TOP L2JBRASIL VOTE MANAGER
# =================================================================
# Documentação oficial: https://top.l2jbrasil.com/index.php?a=webhook_docs
# Utilize "//reload config" no jogo para recarregar os valores no gameserver.
# =================================================================

# Ativa ou desativa a integração do sistema de votação e entrega por webhook
EnableVoteSystem = True

# URL de votação do seu servidor no Top L2JBrasil
# Exemplo: https://top.l2jbrasil.com/index.php?a=in&u=SuaConta
TopL2jBrasilVoteUrl = https://top.l2jbrasil.com/index.php?a=in&u=dhousefe

# Nome ou identificador da conta / servidor cadastrado no Top L2JBrasil (campo "server" do webhook)
# Exemplo: dhousefe ou BrProject ou MeuServidor
TopL2jBrasilServerName = dhousefe

# ID do seu servidor no Top L2JBrasil (Opcional, para validação extra do campo "server")
TopL2jBrasilServerId = 0

# Token Secreto gerado no painel do Top L2JBrasil (Painel » Webhooks » Secret Token)
# O webhook valida este token contra o cabeçalho X-L2JBrasil-Token usando comparação timing-safe
TopL2jBrasilApiSecret = ba25b4458f3ec26caca1db8c9e83b6d16502c354d5834789

# Chave opcional de proteção na URL do Webhook (ex: /api/vote/webhook/l2jbrasil?key=XYZ)
# Deixe vazio caso queira validar exclusivamente pelo cabeçalho X-L2JBrasil-Token
TopL2jBrasilEndpointKey = k9X4m7W2qL8vP1tZ5bN3cR6jY0hD8eF2

# Lista de recompensas entregues ao personagem por voto confirmado
# Formato: itemId,quantidade; itemId,quantidade (separados por ponto e vírgula)
# Exemplos de IDs:
# 4037 = Coin of Luck (Moeda Custom)
# 57   = Adena
# 9511 = Event Medal
VoteRewardItems = 4037,5; 57,5000000

# Intervalo (cooldown) em horas permitido entre votos por conta / IP
# Padrão: 24 horas
VoteCooldownHours = 24

# Permitir entrega de recompensas mesmo se o personagem estiver offline no jogo?
# Se True: os itens são inseridos com segurança no inventário/banco de dados
# Se False: o jogador deve estar online para receber a recompensa
AllowOfflineDelivery = True

# Anunciar globalmente no jogo quando um jogador votar e receber recompensa?
VoteRewardAnnounce = True

# Mensagem do anúncio no jogo (%s será substituído pelo nome do personagem)
VoteRewardAnnounceMsg = O jogador %s votou no Top L2JBrasil e recebeu sua recompensa!

# -----------------------------------------------------------------
#                     EVENTO: RATING (AVALIAÇÃO)
# -----------------------------------------------------------------
# Recompensas entregues quando um jogador avalia o servidor com estrelas (1 a 5)
RatingRewardItems = 4037,20; 57,1000000

# Anunciar globalmente no jogo a avaliação?
RatingRewardAnnounce = True

# Mensagem do anúncio de rating (%s = personagem, %d = nota de 1 a 5 estrelas)
RatingRewardAnnounceMsg = O jogador %s avaliou o servidor no Top L2JBrasil com nota %d estrelas!

# -----------------------------------------------------------------
#                     EVENTO: BOOST (IMPULSO)
# -----------------------------------------------------------------
# Recompensas base para cada impulso (Boost) recebido no Top L2JBrasil
# A quantidade de itens configurada aqui será multiplicada pela quantidade de boosts (data.quantity)
BoostRewardItems = 4037,50; 57,10000000

# Anunciar globalmente no jogo o boost?
BoostRewardAnnounce = True

# Mensagem do anúncio de boost (%s = personagem/servidor, %d = quantidade de boosts)
BoostRewardAnnounceMsg = O jogador %s ativou um BOOST (%dx) no Top L2JBrasil e turbinou o servidor!

# =================================================================
#                 TRAVAS DE SEGURANÇA E ANTI-EXPLOIT
# =================================================================
# Nível mínimo que o personagem deve possuir para receber recompensas de voto/avaliação
# Impede que jogadores criem personagens nível 1 em massa para farmar itens e repassar por trade
VoteMinCharacterLevel = 7

# Tempo mínimo de jogo (em minutos) acumulado que o personagem deve ter no servidor
# Impede a criação de contas novas descartáveis para votação (padrão: 60 minutos)
VoteMinPlaytimeMinutes = 20

# Exigir autenticação/intenção de voto assinada na conta no site?
# Se True: impede votos anônimos manipulados por scripts externos
VoteRequireHmacAuth = False

# Cooldown específico para Avaliação (Rating) em dias (ex: 30 dias)
# Impede que o jogador avalie e ganhe recompensas de 5 estrelas repetidamente
RatingCooldownDays = 30

# Ativar verificação cruzada por Hardware ID (HWID)?
# Impede que a mesma máquina receba recompensas trocando de IP por VPN/VPS
VoteCheckHwid = True
